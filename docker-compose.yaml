# CampusNav — Laravel (Inertia/React) + MySQL
#
# Local:  docker compose up --build
# Test:   copy .env.docker.example to .env.docker, set APP_URL, then:
#         docker compose --env-file .env.docker up --build -d
#
# App:    http://localhost:8000  (or HTTP_PORT from .env.docker)
# Note:   Frontend is built into the app image (no separate frontend container).

name: campusnav

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${HTTP_PORT:-8000}:80"
    environment:
      APP_NAME: ${APP_NAME:-CampusNav}
      APP_ENV: ${APP_ENV:-local}
      APP_DEBUG: ${APP_DEBUG:-true}
      APP_URL: ${APP_URL:-http://localhost:8000}
      APP_KEY: ${APP_KEY:-base64:gc5Z/6Zh5ogTwgOcM9AU32o/fEXJ7JJ3tCZlpVMFuts=}
      LOG_CHANNEL: stderr
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DOCKER_DB_DATABASE:-campusnav}
      DB_USERNAME: ${DOCKER_DB_USERNAME:-campusnav}
      DB_PASSWORD: ${DOCKER_DB_PASSWORD:-campusnav}
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: database
    volumes:
      - app-storage:/var/www/html/storage
      - app-bootstrap-cache:/var/www/html/bootstrap/cache
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1/up"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    restart: unless-stopped

  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DOCKER_DB_DATABASE:-campusnav}
      MYSQL_USER: ${DOCKER_DB_USERNAME:-campusnav}
      MYSQL_PASSWORD: ${DOCKER_DB_PASSWORD:-campusnav}
      MYSQL_ROOT_PASSWORD: ${DOCKER_MYSQL_ROOT_PASSWORD:-root}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped

volumes:
  db-data:
  app-storage:
  app-bootstrap-cache:
